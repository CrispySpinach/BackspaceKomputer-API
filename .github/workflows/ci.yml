name: CI

on:
  push:
    branches:
        - main
  pull_request:
    branches:
        - main      
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-check:
    name: Rust Check & Test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          # Disposable CI service only.
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: backspace-db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d backspace-db"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/backspace-db
      RUST_BACKTRACE: 1
      CARGO_TERM_COLOR: always

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --check

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests including PostgreSQL regression tests
        env:
          TEST_DATABASE_URL: postgres://postgres@localhost:5432/backspace-db
        run: cargo test --locked -- --include-ignored

  docker-smoke-test:
    name: Docker Smoke Test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare .env
        run: |
          if [ -f .env.example ]; then
            cp .env.example .env
          else
            touch .env
          fi

      - name: Build and start Docker Compose stack
        run: docker compose up --build -d

      - name: Show Docker Compose status
        run: docker compose ps

      - name: Wait for PostgreSQL
        run: docker compose up -d --wait --wait-timeout 60

      - name: Smoke test PostgreSQL
        run: docker compose exec -T db pg_isready -U backspace_admin -d backspace_komputer

      - name: Show logs on failure
        if: failure()
        run: docker compose logs

      - name: Cleanup Docker Compose
        if: always()
        run: docker compose down -v