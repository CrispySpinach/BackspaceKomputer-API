[package]
name = "backspacekomputer-api"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.9.0", features = ["runtime-tokio", "tls-rustls", "postgres", "chrono", "rust_decimal", "json", "migrate"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dotenvy = "0.15.7"
chrono = { version = "0.4.45", features = ["serde"] }
rust_decimal = { version = "1.43", features = ["db-postgres"] }
